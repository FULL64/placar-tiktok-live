<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placar da Live — Lula x TIME TIKTOK</title>
<style>
:root{--muted:#c5cdda;--pink:#ec2b91;--blue:#1c4f91;--red:#7c252d;--green:#2f9d68}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:1200px;background:linear-gradient(135deg,rgba(7,13,27,.97),rgba(24,31,51,.97));border:2px solid #ffffff25;border-radius:24px;padding:22px;box-shadow:0 12px 36px #0008}
header{text-align:center;margin-bottom:18px}h1{margin:0;font-size:clamp(24px,3.2vw,42px);letter-spacing:1px}.sub{margin-top:7px;color:var(--muted);font-size:clamp(11px,1.2vw,15px);letter-spacing:1.5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border-radius:18px;padding:16px;min-width:0;text-align:center;border:1px solid #ffffff30;box-shadow:0 5px 18px #0005}.lula{background:linear-gradient(150deg,#0874b7,#102644)}.flavio{background:linear-gradient(150deg,#7c252d,#35151b)}
.photo{height:clamp(130px,22vw,240px);max-height:280px;border-radius:12px;background:#ffffff18;border:2px solid #ffffff40;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;max-width:300px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{font-size:clamp(17px,2vw,26px);font-weight:800;color:#fff9}.name{font-size:clamp(17px,2.1vw,27px);font-weight:900;line-height:1.2;min-height:2.2em;display:flex;align-items:center;justify-content:center}.count{font-size:clamp(46px,7vw,88px);font-weight:900;line-height:1.05;margin:7px 0 3px;font-variant-numeric:tabular-nums;text-shadow:0 3px 12px #0005}.label{font-size:clamp(12px,1.4vw,17px);color:#fffde8}.status{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;margin-top:16px;text-align:center}.dot{width:9px;height:9px;border-radius:50%;background:#f0b429;display:inline-block;flex:0 0 auto}.status.connected .dot{background:#2f9d68}.status.error .dot{background:#ef4444}.small{font-size:11px;color:#aab4c7;text-align:center;margin-top:8px}.controls{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;opacity:.2;transition:opacity .2s}.controls:hover{opacity:1}button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.test{background:#fff;color:#111827}.reset{background:#d93636;color:#fff}
@media(max-width:650px){body{padding:5px}.wrap{padding:12px;border-radius:16px}.cards{gap:8px}.card{padding:9px}.photo{height:150px}.name{font-size:15px}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>DISPUTA AO VIVO</h1><div class="sub">PLACAR DE PRESENTES DA LIVE • 1 PRESENTE = 1 PONTO</div></header>
<div class="cards">
<section class="card lula"><div class="photo"><img id="lulaPhoto" src="https://commons.wikimedia.org/wiki/Special:FilePath/Foto_oficial_de_Luiz_In%C3%A1cio_Lula_da_Silva_%28rosto%29.jpg" alt="Foto de Lula" onerror="this.style.display='none';document.getElementById('lulaPlaceholder').style.display='block'"><div id="lulaPlaceholder" class="placeholder" style="display:none">LULA</div></div><div class="name">LULA</div><div id="lulaCount" class="count">0</div><div class="label">🌹 Rosas recebidas</div></section>
<section class="card flavio"><div class="photo"><img id="flavioPhoto" src="https://commons.wikimedia.org/wiki/Special:FilePath/Fl%C3%A1vio_Bolsonaro.jpg" alt="Foto de TIME TIKTOK" onerror="this.style.display='none';document.getElementById('flavioPlaceholder').style.display='block'"><div id="flavioPlaceholder" class="placeholder" style="display:none">TIME TIKTOK</div></div><div class="name">TIME TIKTOK</div><div id="flavioCount" class="count">0</div><div class="label"> 🎵 Presentes TikTok/div></section>
</div>
<div id="status" class="status"><span id="dot" class="dot"></span><span id="statusText">Placar carregado • aguardando conexão com TikFinity</span></div>
<div class="small">Contagem demonstrativa. Teste a integração antes de iniciar a LIVE.</div>
<div class="controls"><button class="test" onclick="testPoint('lula')">Testar Rosa +1</button><button class="test" onclick="testPoint('flavio')">Testar TikTok +1</button><button class="reset" onclick="resetScores()">Zerar</button></div>
</main>
<script>
(() => {
 let lula=0, flavio=0, socket=null, reconnectTimer=null;
 const statusEl=document.getElementById('status'), statusText=document.getElementById('statusText');
 const render=()=>{document.getElementById('lulaCount').textContent=lula.toLocaleString('pt-BR');document.getElementById('flavioCount').textContent=flavio.toLocaleString('pt-BR')};
 const setStatus=(text,kind='')=>{statusText.textContent=text;statusEl.className='status '+kind};
 const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 function findGiftName(o){const keys=['giftName','gift_name','name','gift','giftTitle','gift_title','gift_name_en','title'];for(const k of keys){const v=o?.[k];if(typeof v==='string'&&v.trim())return v.trim();if(v&&typeof v==='object'){for(const n of ['name','title','giftName'])if(typeof v[n]==='string')return v[n].trim()}}return ''}
 function processMessage(raw){let obj;try{obj=JSON.parse(raw)}catch{return}const event=normalize(obj.event||obj.type||obj.eventType||'');if(event&&!event.includes('gift'))return;let d=obj.data||obj;if(!d||typeof d!=='object')return;if(d.gift&&typeof d.gift==='object')d={...d,...d.gift};const name=normalize(findGiftName(d));if(!name)return;const count=Math.max(1,Math.min(999,Number(d.repeatCount||d.repeat_count||d.giftCount||d.gift_count||d.count||d.comboCount||d.combo_count||1)||1));if(name==='rose'||name==='rosa'||name.includes('rose gift')||name.includes('rosa')){lula+=count;render();setStatus(`Conectado • presente Rosa/Rose +${count} para Lula`,'connected')}else if(name==='panda'||name.includes('panda')){flavio+=count;render();setStatus(`Conectado • presente Panda +${count} para TIME TIKTOK`,'connected')}}
 function connect(){try{socket=new WebSocket('ws://127.0.0.1:21213/');socket.onopen=()=>setStatus('Conectado ao serviço local do TikFinity','connected');socket.onmessage=e=>processMessage(e.data);socket.onerror=()=>setStatus('Página aberta • conexão com TikFinity ainda não confirmada','error');socket.onclose=()=>{setStatus('Sem conexão com TikFinity • verificando novamente','error');clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,4000)}}catch(e){setStatus('Placar carregado • conexão com TikFinity não disponível','error');reconnectTimer=setTimeout(connect,4000)}}
 window.testPoint=side=>{if(side==='lula')lula++;else flavio++;render();setStatus('Teste manual realizado • isso não confirma evento real do TikFinity')};window.resetScores=()=>{lula=0;flavio=0;render();setStatus('Pontuação zerada')};
 render();connect();
})();
</script>
</body>
</html>
