
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar Rosa x Panda</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101019;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:12px;font-size:24px;font-weight:bold}
main{display:flex;gap:12px;padding:12px;max-width:1200px;margin:auto}
.time{width:50%;min-height:360px;border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rosa{background:linear-gradient(145deg,#ff3b9d,#a90054)}
.panda{background:linear-gradient(145deg,#30303b,#08080c);border:2px solid #777}
.emoji{font-size:65px}
h2{font-size:30px;margin:10px 0}
.nome{font-size:20px}
.pontos{font-size:76px;font-weight:bold;margin:18px 0}
button{border:0;border-radius:8px;padding:10px 15px;margin:4px;cursor:pointer;font-size:15px}
.controles{text-align:center;padding:8px}
.status{color:#ccc;font-size:13px;text-align:center;padding:8px}
@media(max-width:600px){main{gap:6px;padding:6px}.time{padding:10px;min-height:280px}h2{font-size:22px}.pontos{font-size:55px}.emoji{font-size:45px}}
</style>
</head>
<body>
<header>🏆 DISPUTA AO VIVO 🏆</header>
<main>
<section class="time rosa">
<div class="emoji">🌹</div>
<h2>TIME ROSA</h2>
<div class="nome">Lula</div>
<div class="pontos" id="rosa">0</div>
<div>Presentes: Rosa</div>
</section>
<section class="time panda">
<div class="emoji">🐼</div>
<h2>TIME PANDA</h2>
<div class="nome">Flávio Bolsonaro</div>
<div class="pontos" id="panda">0</div>
<div>Presentes: Panda</div>
</section>
</main>
<div class="controles">
<button onclick="alterar('rosa',1)">+ Rosa (teste)</button>
<button onclick="alterar('panda',1)">+ Panda (teste)</button>
<button onclick="zerar()">Zerar placar</button>
</div>
<div class="status" id="status">Placar pronto para teste manual. Curtidas não são contabilizadas.</div>
<script>
let pontos={rosa:0,panda:0};
function mostrar(){document.getElementById('rosa').textContent=pontos.rosa;document.getElementById('panda').textContent=pontos.panda}
function alterar(time,n){pontos[time]=Math.max(0,pontos[time]+n);mostrar()}
function zerar(){pontos={rosa:0,panda:0};mostrar()}
</script>
</body>
</html>
